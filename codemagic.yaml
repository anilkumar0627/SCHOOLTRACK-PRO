# Codemagic CI/CD configuration for SchoolTrack Pro SaaS Enterprise Android Application
# For complete documentation, please visit https://docs.codemagic.io/

workflows:
  android-build:
    name: SchoolTrack Pro Android CI/CD Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1 # Premium fast build machine
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "9.3.1"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set Up Environment and Keystores
        script: |
          echo "Verifying Java installation..."
          java -version
          
          # Ensure a fallback .env file exists for the Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating fallback .env from .env.example..."
            cp .env.example .env
          fi

          # Decode the debug keystore to prevent build failures during local signing fallback
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore from base64..."
            base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Warning: debug.keystore.base64 not found!"
          fi
      - name: Generate Gradle Wrapper
        script: |
          # Automatically generates the Gradle wrapper if not present in repository
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found, generating wrapper..."
            gradle wrapper --gradle-version $GRADLE_VERSION
          fi
          chmod +x gradlew
      - name: Run JVM Unit Tests
        script: |
          echo "Executing test suites..."
          ./gradlew testDebugUnitTest --continue
        ignore_failure: true
      - name: Compile Debug and Release APKs
        script: |
          echo "Building Debug and Release APKs..."
          ./gradlew assembleDebug assembleRelease
        ignore_failure: true
      - name: Compile Release App Bundle (AAB)
        script: |
          echo "Building Release App Bundle..."
          ./gradlew bundleRelease
        ignore_failure: true
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - vikash1982vikash@gmail.com
